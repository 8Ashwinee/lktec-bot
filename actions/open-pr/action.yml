name: lktec-bot open-pr
description: >-
  Open a pull request from a branch as the App, or bring the open one for the same head and
  base up to date (title, body, draft state). Requires the setup action first.

inputs:
  app-id:
    description: The GitHub App id (a repository variable or secret).
    required: true
  private-key:
    description: The App's private key in PEM form (a secret).
    required: true
  module:
    description: Module asking for the verb; must be enabled in .github/lktec-bot.yml and allowed to run open-pr.
    required: true
  repository:
    description: Target repository as owner/name.
    required: false
    default: ${{ github.repository }}
  head:
    description: Branch with the changes, in the target repository.
    required: true
  base:
    description: Branch the changes should be merged into.
    required: true
  title:
    description: Pull request title (one line).
    required: true
  body:
    description: Pull request description. Use body-file for multi-line markdown. Left alone on an existing pull request when empty.
    required: false
    default: ""
  body-file:
    description: Path to a file with the description; wins over body when both are given.
    required: false
    default: ""
  draft:
    description: "true to open or keep the pull request as a draft."
    required: false
    default: "false"
  api-url:
    description: API base URL of a GitHub Enterprise Server; empty for github.com.
    required: false
    default: ""
  fail-on-denied:
    description: "Fail the step when the policy denies the verb (default: succeed with result=denied)."
    required: false
    default: "false"

outputs:
  result:
    description: ok, denied or error.
    value: ${{ steps.run.outputs.result }}
  decision:
    description: opened, updated, unchanged, denied or error.
    value: ${{ steps.run.outputs.decision }}
  message:
    description: One line saying what happened.
    value: ${{ steps.run.outputs.message }}
  url:
    description: HTML URL of the pull request.
    value: ${{ steps.run.outputs.url }}
  number:
    description: Number of the pull request.
    value: ${{ steps.run.outputs.number }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        LKTEC_BOT_APP_ID: ${{ inputs.app-id }}
        LKTEC_BOT_PRIVATE_KEY: ${{ inputs.private-key }}
        LKTEC_BOT_API_URL: ${{ inputs.api-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BODY_FILE: ${{ inputs.body-file }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_FAIL_ON_DENIED: ${{ inputs.fail-on-denied }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../lib/run.sh" open-pr

name: lktec-bot comment
description: >-
  Comment on a pull request or an issue as the App. With a marker, the bot's own earlier
  comment carrying that marker is updated instead of adding a new one. Requires the setup
  action first.

inputs:
  app-id:
    description: The GitHub App id (a repository variable or secret).
    required: true
  private-key:
    description: The App's private key in PEM form (a secret).
    required: true
  module:
    description: Module asking for the verb; must be enabled in .github/lktec-bot.yml.
    required: false
    default: automerge
  repository:
    description: Target repository as owner/name.
    required: false
    default: ${{ github.repository }}
  number:
    description: Pull request or issue number.
    required: true
  target:
    description: "pr (needs pull_requests:write) or issue (needs issues:write)."
    required: false
    default: pr
  body:
    description: The comment text. Use body-file for multi-line markdown.
    required: false
    default: ""
  body-file:
    description: Path to a file with the comment text; wins over body when both are given.
    required: false
    default: ""
  marker:
    description: >-
      Identifier (letters, digits, '-', '_', '.') of a comment the bot owns. The body gets an
      invisible <!-- lktec-bot:ID --> tag and later runs update that comment.
    required: false
    default: ""
  api-url:
    description: API base URL of a GitHub Enterprise Server; empty for github.com.
    required: false
    default: ""
  fail-on-denied:
    description: "Fail the step when the policy denies the verb (default: succeed with result=denied)."
    required: false
    default: "false"

outputs:
  result:
    description: ok, denied or error.
    value: ${{ steps.run.outputs.result }}
  message:
    description: One line saying what happened.
    value: ${{ steps.run.outputs.message }}
  url:
    description: HTML URL of the created or updated comment.
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        LKTEC_BOT_APP_ID: ${{ inputs.app-id }}
        LKTEC_BOT_PRIVATE_KEY: ${{ inputs.private-key }}
        LKTEC_BOT_API_URL: ${{ inputs.api-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_NUMBER: ${{ inputs.number }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BODY_FILE: ${{ inputs.body-file }}
        INPUT_MARKER: ${{ inputs.marker }}
        INPUT_FAIL_ON_DENIED: ${{ inputs.fail-on-denied }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../lib/run.sh" comment

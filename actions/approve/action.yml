name: lktec-bot approve
description: >-
  Submit an approving review as the App on an open, non-draft pull request. Idempotent per
  head commit. Requires the setup action first.

inputs:
  app-id:
    description: The GitHub App id (a repository variable or secret).
    required: true
  private-key:
    description: The App's private key in PEM form (a secret).
    required: true
  module:
    description: Module asking for the verb; must be enabled in .github/lktec-bot.yml.
    required: false
    default: automerge
  repository:
    description: Target repository as owner/name.
    required: false
    default: ${{ github.repository }}
  number:
    description: Pull request number.
    required: true
  body:
    description: Optional review text.
    required: false
    default: ""
  body-file:
    description: Path to a file with the review text; wins over body when both are given.
    required: false
    default: ""
  api-url:
    description: API base URL of a GitHub Enterprise Server; empty for github.com.
    required: false
    default: ""
  fail-on-denied:
    description: "Fail the step when the policy denies the verb (default: succeed with result=denied)."
    required: false
    default: "false"

outputs:
  result:
    description: ok, denied or error.
    value: ${{ steps.run.outputs.result }}
  message:
    description: One line saying what happened.
    value: ${{ steps.run.outputs.message }}
  url:
    description: HTML URL of the review (or of the pull request when it was refused).
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        LKTEC_BOT_APP_ID: ${{ inputs.app-id }}
        LKTEC_BOT_PRIVATE_KEY: ${{ inputs.private-key }}
        LKTEC_BOT_API_URL: ${{ inputs.api-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_NUMBER: ${{ inputs.number }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BODY_FILE: ${{ inputs.body-file }}
        INPUT_FAIL_ON_DENIED: ${{ inputs.fail-on-denied }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../lib/run.sh" approve

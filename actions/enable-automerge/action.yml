name: lktec-bot enable-automerge
description: >-
  Enable auto-merge on a pull request as the App; branch protection merges once the required
  checks and reviews are green. Idempotent for the same method. Requires the setup action
  first.

inputs:
  app-id:
    description: The GitHub App id (a repository variable or secret).
    required: true
  private-key:
    description: The App's private key in PEM form (a secret).
    required: true
  module:
    description: Module asking for the verb; must be enabled in .github/lktec-bot.yml.
    required: false
    default: automerge
  repository:
    description: Target repository as owner/name.
    required: false
    default: ${{ github.repository }}
  number:
    description: Pull request number.
    required: true
  method:
    description: squash, merge or rebase.
    required: false
    default: squash
  api-url:
    description: API base URL of a GitHub Enterprise Server; empty for github.com.
    required: false
    default: ""
  fail-on-denied:
    description: "Fail the step when the policy denies the verb (default: succeed with result=denied)."
    required: false
    default: "false"

outputs:
  result:
    description: ok, denied or error.
    value: ${{ steps.run.outputs.result }}
  message:
    description: One line saying what happened.
    value: ${{ steps.run.outputs.message }}
  url:
    description: HTML URL of the pull request.
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        LKTEC_BOT_APP_ID: ${{ inputs.app-id }}
        LKTEC_BOT_PRIVATE_KEY: ${{ inputs.private-key }}
        LKTEC_BOT_API_URL: ${{ inputs.api-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_NUMBER: ${{ inputs.number }}
        INPUT_METHOD: ${{ inputs.method }}
        INPUT_FAIL_ON_DENIED: ${{ inputs.fail-on-denied }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../lib/run.sh" enable-automerge

name: lktec-bot release
description: >-
  Publish a GitHub release as the App. The tag is created at the given commit when it does not
  exist; an existing tag is never moved. Idempotent. Requires the setup action first.

inputs:
  app-id:
    description: The GitHub App id (a repository variable or secret).
    required: true
  private-key:
    description: The App's private key in PEM form (a secret).
    required: true
  module:
    description: Module asking for the verb; must be enabled in .github/lktec-bot.yml.
    required: false
    default: release
  repository:
    description: Target repository as owner/name.
    required: false
    default: ${{ github.repository }}
  tag:
    description: Tag of the release, for example v1.2.3.
    required: true
  sha:
    description: Full id of the commit the tag points at.
    required: true
  name:
    description: Title of the release.
    required: true
  body:
    description: Release notes. Use body-file for multi-line markdown.
    required: false
    default: ""
  body-file:
    description: Path to a file with the release notes; wins over body when both are given.
    required: false
    default: ""
  latest:
    description: "true to mark the release as the latest one (never for a prerelease)."
    required: false
    default: "true"
  prerelease:
    description: "true to mark the release as a prerelease."
    required: false
    default: "false"
  api-url:
    description: API base URL of a GitHub Enterprise Server; empty for github.com.
    required: false
    default: ""
  fail-on-denied:
    description: "Fail the step when the policy denies the verb (default: succeed with result=denied)."
    required: false
    default: "false"

outputs:
  result:
    description: ok, denied or error.
    value: ${{ steps.run.outputs.result }}
  decision:
    description: created, unchanged, denied or error.
    value: ${{ steps.run.outputs.decision }}
  message:
    description: One line saying what happened.
    value: ${{ steps.run.outputs.message }}
  url:
    description: HTML URL of the release.
    value: ${{ steps.run.outputs.url }}
  tag:
    description: The release tag.
    value: ${{ steps.run.outputs.tag }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        LKTEC_BOT_APP_ID: ${{ inputs.app-id }}
        LKTEC_BOT_PRIVATE_KEY: ${{ inputs.private-key }}
        LKTEC_BOT_API_URL: ${{ inputs.api-url }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BODY_FILE: ${{ inputs.body-file }}
        INPUT_LATEST: ${{ inputs.latest }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_FAIL_ON_DENIED: ${{ inputs.fail-on-denied }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../lib/run.sh" release

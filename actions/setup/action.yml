name: lktec-bot setup
description: >-
  Install lktec-bot from this checkout of the action repository with its dependencies pinned
  by hash. The requirements are exported from uv.lock at run time, so the lock file is the
  only source of truth. Run it once per job before any verb action.

inputs:
  python-version:
    description: Python version for actions/setup-python (3.13 or newer).
    required: false
    default: "3.13"
  uv-version:
    description: Version of uv to install (an exact version, not a range).
    required: false
    default: "0.12.24"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    # The Astral mirror is off: with it on, uv is fetched from a host a hardened runner has to
    # allow on top of GitHub itself. setup-uv then reads its version manifest from
    # raw.githubusercontent.com and downloads uv from the GitHub release.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: false
        download-from-astral-mirror: false
    - name: Install lktec-bot with pinned dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        # The interpreter comes from actions/setup-python; uv must never fetch another one.
        UV_PYTHON_DOWNLOADS: never
      run: bash "$ACTION_PATH/install.sh"

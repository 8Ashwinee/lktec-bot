# Weekly Dependabot updates, one grouped PR per ecosystem: GitHub Actions and uv
# (pyproject.toml + uv.lock). Commit prefixes follow Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(ci)"
    open-pull-requests-limit: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 2

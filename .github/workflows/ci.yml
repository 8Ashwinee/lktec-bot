name: CI

# Lint (ruff, mypy) and tests (pytest with coverage) on every pull request and on main. The
# check names in the branch ruleset are the job names: lint, test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR / per branch tip: a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv must never download an interpreter from python-build-standalone: that is an external
  # fetch on every single run. The runner's tool cache already ships the version below,
  # resolved locally by actions/setup-python - and with downloads off a missing interpreter
  # fails loudly instead of being pulled in over the network.
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.12.24"

# Least-privilege default for GITHUB_TOKEN: jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # setup-uv reads its version manifest from raw.githubusercontent.com and, with the
          # Astral mirror off, downloads uv from GitHub releases; uv sync talks to PyPI only.
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          download-from-astral-mirror: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - name: requirements.txt matches uv.lock
        # The composite actions install from requirements.txt (pinned with hashes); it must be
        # the export of the lock, regenerated with exactly this command after every lock change.
        run: |
          uv export --frozen --no-dev --group build --no-emit-project --hashes -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Workflow and action YAML parse strictly
        run: uv run python tools/check_yaml.py .github/workflows actions .github/lktec-bot.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          download-from-astral-mirror: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -p no:cacheprovider
